# Include inside an existing HTTPS server block. The http block must define
# yearly_auth with limit_req_zone, as in deploy/nginx.conf.
# Build with --base /yearly/ and place dist at /opt/yearly/www/yearly/.
# Replace the OSS origins and upstream port for your deployment.
location = /yearly { return 308 /yearly/; }

location = /yearly/api/auth/login {
    access_log off;
    limit_req zone=yearly_auth burst=5 nodelay;
    client_max_body_size 2m;
    proxy_pass http://127.0.0.1:8000/api/auth/login;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /yearly/api/ai-search {
    access_log off;
    client_max_body_size 2m;
    proxy_pass http://127.0.0.1:8000/api/ai-search;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    proxy_buffering off;
}

location ^~ /yearly/api/ {
    access_log off;
    client_max_body_size 2m;
    proxy_pass http://127.0.0.1:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_buffering off;
}

location ^~ /yearly/assets/ {
    root /opt/yearly/www;
    expires 1y;
    try_files $uri =404;
}

location ^~ /yearly/ {
    access_log off;
    root /opt/yearly/www;
    index index.html;
    location ^~ /yearly/share/ {
        rewrite ^/yearly/share/([^/]+)$ /api/public/shares/$1/page break;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /yearly/share-entry.js { expires -1; try_files $uri =404; }
    try_files $uri $uri/ /yearly/index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://your-private-bucket.oss-cn-hangzhou.aliyuncs.com https://media.example.com; media-src 'self' blob: https://your-private-bucket.oss-cn-hangzhou.aliyuncs.com https://media.example.com; connect-src 'self' https://your-private-bucket.oss-cn-hangzhou.aliyuncs.com https://media.example.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}
