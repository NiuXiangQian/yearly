# Place in your existing Nginx http{} configuration. Replace every example domain and certificate path.
# Strip bearer share tokens as well as query strings from access logs.
map $uri $yearly_log_uri {
    ~^/api/public/shares/ /api/public/shares/[redacted];
    ~^/share/ /share/[redacted];
    default $uri;
}
log_format yearly_safe '$remote_addr [$time_local] "$request_method $yearly_log_uri" $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=yearly_auth:1m rate=6r/m;

server {
    listen 80;
    access_log /var/log/nginx/yearly-access.log yearly_safe;
    server_name yearly.example.com;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name yearly.example.com;
    ssl_certificate /etc/letsencrypt/live/yearly.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yearly.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/yearly/frontend/dist;
    index index.html;
    access_log /var/log/nginx/yearly-access.log yearly_safe;
    error_log /var/log/nginx/yearly-error.log warn;
    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    # Replace BOTH OSS origins with your actual bucket endpoint and bound custom domain.
    # hash-wasm needs wasm-unsafe-eval. HEIC decoding uses a Blob worker.
    # Element Plus uses inline styles.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://your-private-bucket.oss-cn-hangzhou.aliyuncs.com https://media.example.com; media-src 'self' blob: https://your-private-bucket.oss-cn-hangzhou.aliyuncs.com https://media.example.com; connect-src 'self' https://your-private-bucket.oss-cn-hangzhou.aliyuncs.com https://media.example.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /api/auth/login {
        limit_req zone=yearly_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/ai-search {
        access_log off;
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:8000/api/ai-search;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location /share/ {
        rewrite ^/share/([^/]+)$ /api/public/shares/$1/page break;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /share-entry.js { expires -1; try_files $uri =404; }
    location /assets/ { expires 1y; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
