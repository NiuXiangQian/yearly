# Include inside the existing nginx http{} block.
# Replace YEARLY_HOST and YEARLY_OSS_ORIGINS before installation.
map $uri $yearly_test_log_uri {
    ~^/api/public/shares/ /api/public/shares/[redacted];
    ~^/share/ /share/[redacted];
    default $uri;
}
log_format yearly_test_safe '$remote_addr [$time_local] "$request_method $yearly_test_log_uri" $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=yearly_test_auth:1m rate=6r/m;

server {
    listen 80;
    server_name YEARLY_HOST;
    root /opt/yearly-test/current/frontend/dist;
    index index.html;
    client_max_body_size 2m;
    access_log /var/log/nginx/yearly-test-access.log yearly_test_safe;
    error_log /var/log/nginx/yearly-test-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: YEARLY_OSS_ORIGINS; media-src 'self' blob: YEARLY_OSS_ORIGINS; connect-src 'self' YEARLY_OSS_ORIGINS; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /api/auth/login {
        limit_req zone=yearly_test_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location /assets/ { expires 1y; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
